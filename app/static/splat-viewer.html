<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full-Fidelity Splat Viewer</title>
  <style>
    :root {
      color: #edf4ff;
      background: #02060d;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 176, 103, 0.18), transparent 28%),
        linear-gradient(180deg, #08111f 0%, #02060d 100%);
    }
    #viewerRoot {
      position: fixed;
      inset: 0;
    }
    .hud {
      position: fixed;
      z-index: 5;
      left: 16px;
      top: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .chip, button {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 10px 13px;
      color: #edf4ff;
      background: rgba(4, 10, 20, 0.72);
      backdrop-filter: blur(10px);
      font: inherit;
      line-height: 1.2;
    }
    button {
      cursor: pointer;
      pointer-events: auto;
    }
    a {
      color: #ffd39c;
    }
    .error {
      border-color: rgba(255, 152, 152, 0.46);
      background: rgba(61, 10, 10, 0.78);
    }
  </style>
</head>
<body>
  <div id="viewerRoot"></div>
  <div class="hud">
    <div id="status" class="chip">Loading full-fidelity splat viewer...</div>
    <button id="fullscreen" type="button">Fullscreen</button>
  </div>
  <script type="module" src="/static/splat-viewer-page.js?v=1"></script>
</body>
</html>
